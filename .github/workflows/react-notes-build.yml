name: React Notes App Build

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.js"
      - ".github/workflows/react-notes-build.yml"
  push:
    branches: [main, feat/react-notes-submission]
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "index.html"
      - "vite.config.js"
      - ".github/workflows/react-notes-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
